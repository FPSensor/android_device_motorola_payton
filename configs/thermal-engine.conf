# Kernel 4.19 thermal zone names.
# Same thresholds as the 4.4 configuration; sensors were renamed:
#   tsens_tz_sensorN -> zone using <&tsens N> (sdm630-thermal.dtsi)
#     2: cpuss-1-usr, 3-6: cpu-1-0..3-usr (cluster1), 9: video-usr
#   msm_therm -> msm-therm-adc, quiet_therm -> quiet-therm-adc
#   batt_therm -> battery (power_supply thermal zone)
#   chg_therm is kept (pm660 adc_tm channel with qcom,thermal-node)

[FRONT_TEMP]
algo_type        virtual
trip_sensor      msm-therm-adc
set_point        -18000
set_point_clr    -20000
sensors          msm-therm-adc chg_therm battery
weights          110       85        110
offsets          -2000     -2000     -2000
sampling         10000
math             0
sys_temp

[REPORT-FRONT-TEMP]
algo_type        monitor
sampling         300000
sensor           FRONT_TEMP
thresholds       45000
thresholds_clr   43000
actions          report
action_info      1

[BACK_TEMP]
algo_type        virtual
trip_sensor      msm-therm-adc
set_point        -18000
set_point_clr    -20000
sensors          msm-therm-adc chg_therm battery
weights          110       85        110
offsets          -1000     -1000     -1000
sampling         10000
math             0
sys_temp

[REPORT-BACK-TEMP]
algo_type        monitor
sampling         300000
sensor           BACK_TEMP
thresholds       45000
thresholds_clr   43000
actions          report
action_info      1

[SS-BATT-BATT]
algo_type        ss
sampling         5000
sensor           battery
device           battery
set_point        45000
set_point_clr    42000
device_max_limit 3

[SS-CHG-BATT]
algo_type        ss
sampling         1000
sensor           chg_therm
device           battery
set_point        52000
set_point_clr    48000
time_constant 0
device_max_limit 3

[VIRT-CHG-CPUS]
algo_type        virtual
trip_sensor      chg_therm
set_point        50000
set_point_clr    47000
sensors          cpu-1-0-usr cpu-1-1-usr cpu-1-2-usr cpu-1-3-usr
weights          1       1       1        1
sampling         1000
math             0

[SS-VIRT-CHG-BATT]
algo_type        ss
sampling         1000
sensor           VIRT-CHG-CPUS
device           battery
set_point        43000
set_point_clr    40000
device_max_limit 3

[VIRT-MSM-CLUSTER1]
algo_type        virtual
trip_sensor      msm-therm-adc
set_point        50000
set_point_clr    46000
sensors          cpu-1-0-usr cpu-1-1-usr cpu-1-2-usr cpu-1-3-usr
weights          1       1       1        1
sampling         1000
math             0

[SS-VIRT-CLUSTER1]
algo_type        ss
